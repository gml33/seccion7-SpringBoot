<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<title>Listado</title>
</head>
<body>
	<div align="center">
		<p th:inline="text">Bienvenido <span sec:authentication="name"></span></p>
		<form th:action="@{/logout}" method="post">
			<input type="submit" value="Salir">
		</form>
		<h1>Listado de personas</h1>
		<br>
		<table border="1" cellpadding="10">
			<tr>
				<th>Id</th>
				<th>Nombre</th>
				<th>Edad</th>
				<th sec:authorize="hasRole('ADMIN')">Acciones</th>
			</tr>
			<tr th:each="persona: ${personas}">
				<td th:text="${persona.id}"></td>
				<td th:text="${persona.nombre}"></td>
				<td th:text="${persona.edad}"></td>
				<td sec:authorize="hasRole('ADMIN')">
					<a th:href="@{/personas/editar/{id}(id=${persona.id})}">Editar</a>
					<a th:href="@{/personas/eliminar/{id}(id=${persona.id})}">Eliminar</a>
				</td>
			</tr>
		</table>
	</div>
	<div sec:authorize="hasRole('ADMIN')">
		<a href="/personas/nueva">Agregar</a>
	</div>

</body>
</html>
